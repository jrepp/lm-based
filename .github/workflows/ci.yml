name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Sync locked Python environment
        run: uv sync --frozen

      - name: Run Python tests
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Run Go tests
        run: go test ./...

      - name: Validate model sidecars
        env:
          UV_FROZEN: "1"
        run: ./route-config.py --validate

      - name: Validate docs CMS
        run: >-
          uv run --no-project --python 3.11 --with docuchango==1.17.1
          docuchango validate

      - name: Run pre-commit on pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          uvx --from pre-commit==4.6.1 pre-commit run
          --from-ref "$BASE_SHA" --to-ref "$GITHUB_SHA" --show-diff-on-failure

      - name: Run pre-commit on pushed changes
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: >-
          uvx --from pre-commit==4.6.1 pre-commit run
          --from-ref "$BASE_SHA" --to-ref "$GITHUB_SHA" --show-diff-on-failure
