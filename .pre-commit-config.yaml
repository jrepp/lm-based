default_install_hook_types: [pre-commit, pre-push]
# Hooks run at commit time; only branch-not-merged runs on push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        stages: [pre-commit]  # its manifest also opts into pre-push
      - id: trailing-whitespace
        stages: [pre-commit]  # its manifest also opts into pre-push

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        files: ^(README\.md|AGENTS\.md|CLAUDE\.md|docs/.*\.md)$

  - repo: local
    hooks:
      - id: branch-not-merged
        name: refuse pushes to a branch whose PR is merged
        entry: scripts/check-branch-not-merged.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
