{
  "api_version": "v1",
  "ingress": {
    "public_listen": "127.0.0.1:8080",
    "swap_listen": "127.0.0.1:8081",
    "swap_ui_enabled": false
  },
  "workers": {
    "host": "127.0.0.1",
    "port_range": {
      "start": 10001,
      "end": 10100
    },
    "default_run_mode": "swap_worker",
    "default_enable_run_capture": false
  },
  "models": {
    "enabled": [
      "mistral-7b-instruct-v03-q4km",
      "glm-ocr-q8_0"
    ],
    "disabled": [],
    "warm": [],
    "operator_only": []
  },
  "swap": {
    "global_ttl_seconds": 0,
    "send_loading_state": true,
    "routing": {
      "router": {
        "use": "group",
        "settings": {
          "groups": {
            "small": {
              "swap": false,
              "exclusive": false,
              "persistent": false,
              "members": ["glm-ocr-q8_0"]
            },
            "main": {
              "swap": true,
              "exclusive": false,
              "members": ["mistral-7b-instruct-v03-q4km"]
            }
          }
        }
      }
    }
  },
  "observability": {
    "metrics_listen": "127.0.0.1:9091",
    "structured_logs": true
  },
  "policy": {
    "allow_non_gguf": true,
    "require_local_artifact": true,
    "fail_apply_on_missing_model": true
  }
}
